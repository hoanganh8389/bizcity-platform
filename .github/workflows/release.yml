# [2026-11-24 06:31 PM Johnny Chu - Chu Hoàng Anh] P2b-5 — phát hành: gắn tag vX.Y.Z ⇒ build + test như CI ⇒ đóng gói 2 tệp .tgz ⇒ tạo GitHub Release đính kèm
#   (chủ chốt 2026-11-24: Release thay registry; app cài bằng URL tệp). Phiên bản trong package.json phải khớp tag (tools/dong-goi.mjs kiểm).
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: x }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:x@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: node tools/spine-check.mjs
      - run: node tools/dong-goi.mjs "${GITHUB_REF_NAME#v}" dist-release
      - name: Tạo Release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "$GITHUB_REF_NAME" dist-release/*.tgz --title "$GITHUB_REF_NAME" --notes "Gói @bizcity/contracts và @bizcity/platform $GITHUB_REF_NAME. Cài bằng URL tệp (xem README › Phát hành)."
