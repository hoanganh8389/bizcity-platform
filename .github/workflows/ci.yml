# [2026-11-24 06:31 PM Johnny Chu - Chu Hoàng Anh] P2b-5 — CI: mọi PR và main chạy npm test (build + test kiểu + node:test trên Postgres 16 thật) và bộ kiểm SPINE.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: x }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:x@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: node tools/spine-check.mjs
      # [2026-11-24 11:48 PM Johnny Chu - Chu Hoàng Anh] STD-1 — tự kiểm sổ chuẩn nền
      - run: node tools/standard-check.mjs
      # [2026-11-25 10:34 AM Johnny Chu - Chu Hoàng Anh] USERS-1 — vector khuôn người dùng · vai · quyền
      - run: node tools/users-check.mjs
      # [2026-11-25 01:16 PM Johnny Chu - Chu Hoàng Anh] STD-5 — sổ nợ chuẩn nền
      - run: node tools/no-chuan.mjs --check
      # [2026-11-25 01:39 PM Johnny Chu - Chu Hoàng Anh] STD-8 — bộ mẫu nghiệm thu / bàn giao
      - run: node tools/delivery-check.mjs --self-test
      # [2026-11-25 05:18 PM Johnny Chu - Chu Hoàng Anh] STD-10 — bộ mẫu bản đồ lỗi theo màn
      - run: node tools/failure-check.mjs --self-test
