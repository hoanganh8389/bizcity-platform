# [2026-11-24 06:31 PM Johnny Chu - Chu Hoàng Anh] P2b-5 — CI của repo gói nền.
# [2026-11-27 11:31 PM Johnny Chu - Chu Hoàng Anh] NC-003 C2 — mã lõi dời sang open-core: CI chỉ còn các bộ kiểm của open-platform (npm test gọi đủ tự kiểm), không còn build / Postgres.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  kiem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
